name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Find project and build APK
        run: |
          PKG_DIR=$(dirname $(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1))
          echo "Found project at: $PKG_DIR"
          cd "$PKG_DIR"
          npm install
          npm run build
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Study With Aspirant" "com.studywithaspirant.app" --web-dir=dist || true
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/output/"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-With-Aspirant-APK
          path: output/app-debug.apk
          
